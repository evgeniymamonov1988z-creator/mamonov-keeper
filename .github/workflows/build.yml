name: Build signed EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE (folder mode)
        run: pyinstaller --noconfirm --clean --name "Keeper" --onedir --windowed keeper.py

      - name: Create self-signed certificate and sign
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Evgeniy Mamonov" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(5)

          Get-ChildItem -Path dist\Keeper -Recurse -Include *.exe | ForEach-Object {
            Write-Host "Signing $($_.FullName)"
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert | Out-Null
          }

          Write-Host "Signature on main EXE:"
          Get-AuthenticodeSignature -FilePath dist\Keeper\Keeper.exe | Format-List

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\Keeper\* -DestinationPath Keeper-signed.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-signed
          path: Keeper-signed.zip
