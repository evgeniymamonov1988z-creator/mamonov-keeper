name: Build signed EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE (single file)
        run: pyinstaller --noconfirm --clean --name "Keeper" --onefile --windowed keeper.py

      - name: Create self-signed certificate and sign
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Evgeniy Mamonov" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(5)

          Set-AuthenticodeSignature -FilePath dist\Keeper.exe -Certificate $cert | Out-Null

          Write-Host "Signature on EXE:"
          Get-AuthenticodeSignature -FilePath dist\Keeper.exe | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-signed-exe
          path: dist\Keeper.exe
